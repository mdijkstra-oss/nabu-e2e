# D9: a new record created without an id gets one generated in the strict
# format annotation-[0-9][a-z0-9]{7}.
endpoint: /qual-coder
contains:
  - "GREETING MODE"
  - "E2E-D9-FORMAT"
reply:
  text: "Annotating."
  toolCalls:
    - name: patch_annotations
      args:
        path: d9-doc.md
        operations:
          - op: add_annotation
            item:
              text: "described their routine"
              reason: "E2E-D9-FORMAT-R"
              color: "blue"
