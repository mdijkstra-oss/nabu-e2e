# The edit anchor differs from the document text; token-strict fallback must
# resolve it without line numbers.
endpoint: /qual-coder
contains:
  - "GREETING MODE"
  - E2E-T5-FUZZY
  - "Patched `json-annotations` block in t5-doc.md"
reply:
  toolCalls:
    - name: edit_file
      callId: call-t5-edit
      args:
        path: t5-doc.md
        match: { type: full_anchor, anchor: "And she guards it fiercely!" }
        replacement: "and she protects it with T5-EDIT-LANDED rules."
