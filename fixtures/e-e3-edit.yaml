# E3: the marker turn answers with one edit_file call touching field-notes.md,
# so a sync round demonstrably runs after every companion already exists.
# Stateless single reply: the fake's replies-counter survives suite reruns on a
# reused stack, so the follow-up lives in e-e3-edit-done.yaml instead.
endpoint: /qual-coder
contains: ["GREETING MODE", "E2E-E3-EDIT-TURN"]
reply:
  toolCalls:
    - name: edit_file
      args:
        path: field-notes.md
        match:
          type: full_anchor
          anchor: "Open question for the next round"
        replacement: "Open question E2E-E3-ROUND-MARKER for the next round"
